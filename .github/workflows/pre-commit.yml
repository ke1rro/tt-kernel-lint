name: Pre-commit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml', 'requirements-dev.txt') }}

      - name: Install development tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install LLVM 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          rm llvm.sh
          sudo apt-get install -y --no-install-recommends llvm-20-dev

      - name: Configure CMake for clang-tidy
        run: |
          .venv/bin/python -m pip install cmake ninja
          PATH="$PWD/.venv/bin:$PATH" cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm -DBUILD_KERNELS=OFF

      - name: Run pre-commit checks
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure --color=always
