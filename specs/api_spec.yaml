  parameters:
  - name: idst
    type: uint32_t
    is_template: false
    description: Destination register slot index
  hardware_effects:
  - Executes vector natural log in-place on DST[idst] using vConstFloatPrgm0..2
  failure_mode: Executing without log_tile_init produces wrong numerical values.
  description: Computes natural logarithm element-wise in-place on tile in destination register.
