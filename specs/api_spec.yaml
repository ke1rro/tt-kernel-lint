version: '1.0'
description: Formal specification of Tenstorrent Tensix Compute and Data Movement APIs, invariants, hardware contracts, and
  failure modes for static analysis.
architectures:
- Wormhole_B0
- Blackhole
- Quasar
threads:
- id: TRISC0_UNPACK
  name: TRISC0 (UNPACK)
  description: Unrolls tiles from CBs/DFBs into SrcA and SrcB physical registers, drives unpacker face geometry.
- id: TRISC1_MATH
  name: TRISC1 (MATH)
  description: Executes FPU matrix multiplications, SFPU vector math, and ALU operations; writes into DST.
- id: TRISC2_PACK
  name: TRISC2 (PACK)
  description: Reads computed tiles/rows from DST, quantizes/formats data, and writes to output CBs/DFBs.
- id: DM_BRISC
  name: BRISC (Data Movement Primary)
  description: Executes asynchronous NoC operations (read, write, atomic, multicast) and Circular Buffer management.
- id: DM_NCRISC
  name: NCRISC (Data Movement Secondary)
  description: Executes asynchronous NoC operations and Circular Buffer management in parallel with BRISC.
states:
- id: UNINITIALIZED
  description: Kernel entry before compute_kernel_hw_startup has run.
- id: CANONICAL_IDLE
  description: Hardware configured with standard 32x32 tile descriptors, default pack mode, zero edge masks, no active specialized
    state.
- id: MATH_IDLE
  description: MATH thread is not holding a DST section.
- id: MATH_DST_HELD
  description: MATH thread has acquired DST lock via tile_regs_acquire and can write to DST.
- id: PACK_IDLE
  description: PACK thread is not holding a DST section.
- id: PACK_DST_HELD
  description: PACK thread has waited for MATH commit via tile_regs_wait and can read from DST.
- id: CB_TILES_AVAILABLE
  description: Circular buffer front has been waited on and contains at least requested tile count.
- id: CB_SLOTS_RESERVED
  description: Circular buffer back has been reserved and has sufficient free slots for writing.
- id: NOC_READ_IN_FLIGHT
  description: Asynchronous NoC read transaction has been queued but not yet synchronized with a barrier.
- id: NOC_WRITE_IN_FLIGHT
  description: Asynchronous NoC write transaction has been queued but not yet synchronized with a barrier.
- id: IN_TILIZE_MODE
  description: Unpacker and packer configured for row-at-a-time tilize conversion. PackMode::Tilize armed on Blackhole.
- id: IN_UNTILIZE_MODE
  description: Packer or unpacker configured for tile-to-row untilize conversion. Non-canonical dest offset registers armed.
- id: IN_REDUCE_MODE
  description: Packer reduce edge masks active (_llk_pack_reduce_mask_config_). Any non-reduce pack will zero non-reduction
    elements.
- id: IN_UNARY_BCAST_MODE
  description: Unpacker configured to broadcast lines/faces into SrcB; Math configured for B2D datacopy.
- id: IN_CUSTOM_MM_DENSE_MODE
  description: Packer Z/W strides configured for 16-row / 32-row dense destination layout.
instructions:
- name: compute_kernel_hw_startup
  signature: template <SrcOrder src_order = SrcOrder::Regular> void compute_kernel_hw_startup(uint32_t icb0, uint32_t icb1,
    uint32_t ocb)
  header: tt_metal/hw/inc/api/compute/compute_kernel_hw_startup.h
  category: startup
  thread_affinity:
  - TRISC0_UNPACK
  - TRISC1_MATH
  - TRISC2_PACK
  placement: entry_block_only
  allowed_in_loop: false
  state_machine:
    precondition_state: UNINITIALIZED
    postcondition_state: CANONICAL_IDLE
    must_pair_with: null
  parameters:
  - name: src_order
    type: SrcOrder
    is_template: true
    description: 'Operand mapping: Regular (icb0->SrcA, icb1->SrcB) or Reverse (icb0->SrcB, icb1->SrcA for matmul)'
  - name: icb0
    type: uint32_t
    is_template: false
    description: Input circular buffer 0 index
  - name: icb1
    type: uint32_t
    is_template: false
    description: Input circular buffer 1 index
  - name: ocb
    type: uint32_t
    is_template: false
    description: Output circular buffer index
  hardware_effects:
  - MMIO writes to unpack tile descriptors (tile byte sizes, face counts)
  - MMIO writes to ALU format specification registers (ALU_FORMAT_SPEC_REG)
  - Packer destination offset registers reset (llk_pack_dest_init)
  - Sync mode register armed (DST_SYNC_MODE)
  - ComputeKernelSentinel baseline state updated
  failure_mode: Calling mid-kernel causes slow MMIO stalls and execution unit race conditions. Omitting SrcOrder::Reverse
    for matmul inverts matrix multiplication operands.
  description: Mandatory one-time hardware initialization performed at kernel entry before any compute or copy operation.
- name: compute_kernel_hw_cleanup
  signature: void compute_kernel_hw_cleanup()
  header: tt_metal/hw/inc/api/compute/experimental/compute_kernel_hw_cleanup.h
  category: cleanup
  thread_affinity:
  - TRISC0_UNPACK
  - TRISC1_MATH
  - TRISC2_PACK
  placement: between_completed_ops
  allowed_in_loop: false
  state_machine:
    precondition_state: ANY
    postcondition_state: CANONICAL_IDLE
    must_pair_with: null
  parameters: []
  hardware_effects:
  - Normalizes formats to Float16_b, 32x32, 4 faces on cfg bank 0
  - Resets math/pack destination semaphores and ping-pong state
  - Clears Blackhole destination read address remap
  - Poisons unpack/math MOPs and ADDR_MOD_0..7 to force explicit op re-init
  failure_mode: Calling while mailboxes are active or semaphores have not drained causes deadlock.
  description: Blackhole compute hardware normalization barrier resetting mutable configuration to canonical baseline.
- name: enable_fp32_dest_acc
  signature: void enable_fp32_dest_acc()
  header: tt_metal/hw/inc/api/compute/compute_kernel_hw_startup.h
  category: startup
  thread_affinity:
  - TRISC0_UNPACK
  - TRISC1_MATH
  - TRISC2_PACK
  placement: anywhere
  allowed_in_loop: true
  state_machine:
    precondition_state: CANONICAL_IDLE
    postcondition_state: CANONICAL_IDLE
    must_pair_with: disable_fp32_dest_acc
  parameters: []
  hardware_effects:
  - ALU_ACC_CTRL Fp32_enabled set to 1
  - SFPU_Fp32_enabled set to 1
  - PCK_DEST_RD_CTRL Read_32b_data set to 1
  - Synchronizes all 3 TRISCs via tensix_sync before and after CFG write
  failure_mode: Failing to call on all 3 TRISCs simultaneously deadlocks mailboxes. Omitting paired disable leaves packer
    in 32-bit mode for 16-bit tiles.
  description: Dynamically enables 32-bit destination register accumulation across Math and Pack pipelines.
- name: disable_fp32_dest_acc
  signature: void disable_fp32_dest_acc()
  header: tt_metal/hw/inc/api/compute/compute_kernel_hw_startup.h
  category: startup
  thread_affinity:
  - TRISC0_UNPACK
  - TRISC1_MATH
  - TRISC2_PACK
  placement: anywhere
  allowed_in_loop: true
  state_machine:
    precondition_state: CANONICAL_IDLE
    postcondition_state: CANONICAL_IDLE
    must_pair_with: enable_fp32_dest_acc
  parameters: []
  hardware_effects:
  - ALU_ACC_CTRL Fp32_enabled set to 0
  - SFPU_Fp32_enabled set to 0
  - PCK_DEST_RD_CTRL Read_32b_data set to 0
  failure_mode: Mismatched accumulation mode with output packer format causes tile corruption.
  description: Dynamically disables 32-bit destination accumulation, reverting to 16-bit accumulation mode.
- name: restore_fp32_dest_acc
  signature: template <bool is_fp32_dest_acc_en = DST_ACCUM_MODE> void restore_fp32_dest_acc()
  header: tt_metal/hw/inc/api/compute/compute_kernel_hw_startup.h
  category: startup
  thread_affinity:
  - TRISC0_UNPACK
  - TRISC1_MATH
  - TRISC2_PACK
  placement: anywhere
  allowed_in_loop: true
  state_machine:
    precondition_state: CANONICAL_IDLE
    postcondition_state: CANONICAL_IDLE
    must_pair_with: null
  parameters:
  - name: is_fp32_dest_acc_en
    type: bool
    is_template: true
    description: Kernel compile-time baseline accumulation mode
  hardware_effects:
  - Restores ALU_ACC_CTRL and PCK_DEST_RD_CTRL to kernel's compile-time DST_ACCUM_MODE
  failure_mode: Omitting restore leaves hardware accumulation mode permanently inverted for subsequent operations.
  description: Restores Destination register accumulation mode to the kernel's compile-time default.
- name: tile_regs_acquire
  signature: void tile_regs_acquire()
  header: tt_metal/hw/inc/api/compute/reg_api.h
  category: reg_lifecycle
  thread_affinity:
  - TRISC1_MATH
  - TRISC0_UNPACK
  placement: before_compute_writes
  allowed_in_loop: true
  state_machine:
    precondition_state: MATH_IDLE
    postcondition_state: MATH_DST_HELD
    must_pair_with: tile_regs_commit
  parameters: []
  hardware_effects:
  - Blocks MATH thread until hardware destination section semaphore is granted
  - Opens UNPACK destination section on Quasar unpack-to-dest
  failure_mode: Double acquire without commit causes instant deadlock. Nesting inside an accumulation loop causes release
    to zero out partial sums.
  description: Acquires exclusive lock on Destination register section for Math thread computation.
- name: tile_regs_commit
  signature: template <bool is_fp32_dest_acc_en = DST_ACCUM_MODE> void tile_regs_commit()
  header: tt_metal/hw/inc/api/compute/reg_api.h
  category: reg_lifecycle
  thread_affinity:
  - TRISC1_MATH
  - TRISC0_UNPACK
  placement: after_compute_writes
  allowed_in_loop: true
  state_machine:
    precondition_state: MATH_DST_HELD
    postcondition_state: MATH_IDLE
    must_pair_with: tile_regs_acquire
  parameters:
  - name: is_fp32_dest_acc_en
    type: bool
    is_template: true
    description: Current accumulation mode matching hardware
  hardware_effects:
  - Flushes Math writes to DST
  - Signals hardware semaphore that Math section is done, unblocking Pack thread
  failure_mode: Committing without acquire or with mismatched accumulation mode causes hardware hang or corrupted math-pack
    phase.
  description: Releases Destination register lock from Math thread and hands the section off to the Packer.
- name: tile_regs_wait
  signature: void tile_regs_wait()
  header: tt_metal/hw/inc/api/compute/reg_api.h
  category: reg_lifecycle
  thread_affinity:
  - TRISC2_PACK
  placement: before_pack_reads
  allowed_in_loop: true
  state_machine:
    precondition_state: PACK_IDLE
    postcondition_state: PACK_DST_HELD
    must_pair_with: tile_regs_release
  parameters: []
  hardware_effects:
  - Blocks PACK thread until Math thread signals completion of destination section
  failure_mode: Waiting without matching Math commit hangs the Pack thread forever.
  description: Acquires exclusive lock on Destination register section for Pack thread reading.
- name: tile_regs_release
  signature: template <bool is_fp32_dest_acc_en = DST_ACCUM_MODE> void tile_regs_release()
  header: tt_metal/hw/inc/api/compute/reg_api.h
  category: reg_lifecycle
  thread_affinity:
  - TRISC2_PACK
  placement: after_pack_reads
  allowed_in_loop: true
  state_machine:
    precondition_state: PACK_DST_HELD
    postcondition_state: PACK_IDLE
    must_pair_with: tile_regs_wait
  parameters:
  - name: is_fp32_dest_acc_en
    type: bool
    is_template: true
    description: Current accumulation mode matching hardware
  hardware_effects:
  - Flushes pack reads
  - Zeroes Destination register section (ZEROACC)
  - Frees destination section back to Math thread pool
  failure_mode: Releasing without wait or omitting release causes Math thread to starve and hang on subsequent acquire.
  description: Releases Destination register lock from Pack thread, zeroing the section and returning it to Math.
- name: acquire_dst
  signature: void acquire_dst()
  header: tt_metal/hw/inc/api/compute/reg_api.h
  category: reg_lifecycle
  thread_affinity:
  - TRISC1_MATH
  - TRISC2_PACK
  placement: before_compute_and_pack
  allowed_in_loop: true
  state_machine:
    precondition_state: MATH_IDLE
    postcondition_state: MATH_DST_HELD
    must_pair_with: release_dst
  parameters: []
  hardware_effects:
  - Blocks both MATH and PACK threads simultaneously until DST is acquired (coupled lockstep)
  failure_mode: Mixing coupled acquire_dst with decoupled tile_regs_* creates semaphore protocol deadlocks.
  description: Deprecated legacy synchronous DST acquire blocking both Math and Pack pipelines simultaneously.
- name: release_dst
  signature: void release_dst()
  header: tt_metal/hw/inc/api/compute/reg_api.h
  category: reg_lifecycle
  thread_affinity:
  - TRISC1_MATH
  - TRISC2_PACK
  placement: after_compute_and_pack
  allowed_in_loop: true
  state_machine:
    precondition_state: MATH_DST_HELD
    postcondition_state: MATH_IDLE
    must_pair_with: acquire_dst
  parameters: []
  hardware_effects:
  - Releases coupled lockstep DST reservation across Math and Pack
  failure_mode: Mismatched calling between Math and Pack threads deadlocks synchronization hardware.
  description: Deprecated legacy synchronous DST release clearing coupled Math-Pack reservation.
- name: cb_wait_front
  signature: void cb_wait_front(uint32_t cbid, uint32_t ntiles)
  header: tt_metal/hw/inc/api/compute/cb_api.h
  category: cb_lifecycle
  thread_affinity:
  - TRISC0_UNPACK
  - DM_BRISC
  - DM_NCRISC
  placement: before_unpack_or_read
  allowed_in_loop: true
  state_machine:
    precondition_state: ANY
    postcondition_state: CB_TILES_AVAILABLE
    must_pair_with: cb_pop_front
  parameters:
  - name: cbid
    type: uint32_t
    is_template: false
    description: Circular buffer index (0..31)
  - name: ntiles
    type: uint32_t
    is_template: false
    description: Cumulative tile count to wait for (non-decreasing)
  hardware_effects:
  - Polls local L1 CB occupancy register until >= ntiles are valid
  failure_mode: Calling on TRISC1 (MATH) or TRISC2 (PACK) is forbidden. Non-cumulative calls without pop cause desynchronization.
  description: Blocking call waiting for producer to provide specified number of tiles in the circular buffer.
- name: cb_pop_front
  signature: void cb_pop_front(uint32_t cbid, uint32_t ntiles)
  header: tt_metal/hw/inc/api/compute/cb_api.h
  category: cb_lifecycle
  thread_affinity:
  - TRISC0_UNPACK
  - DM_BRISC
  - DM_NCRISC
  placement: after_unpack_or_read
  allowed_in_loop: true
  state_machine:
    precondition_state: CB_TILES_AVAILABLE
    postcondition_state: ANY
    must_pair_with: cb_wait_front
  parameters:
  - name: cbid
    type: uint32_t
    is_template: false
    description: Circular buffer index (0..31)
  - name: ntiles
    type: uint32_t
    is_template: false
    description: Tile count to pop from front
  hardware_effects:
  - Advances circular buffer read pointer in L1
  - Increments available free slot counter for producer
  failure_mode: Popping more tiles than waited for corrupts read pointer. In dataflow, calling before noc_async_write_barrier
    causes WAR race condition.
  description: Frees consumed tiles from the front of circular buffer, advancing read pointer.
- name: cb_reserve_back
  signature: void cb_reserve_back(uint32_t cbid, uint32_t ntiles)
  header: tt_metal/hw/inc/api/compute/cb_api.h
  category: cb_lifecycle
  thread_affinity:
  - TRISC2_PACK
  - DM_BRISC
  - DM_NCRISC
  placement: before_pack_or_write
  allowed_in_loop: true
  state_machine:
    precondition_state: ANY
    postcondition_state: CB_SLOTS_RESERVED
    must_pair_with: cb_push_back
  parameters:
  - name: cbid
    type: uint32_t
    is_template: false
    description: Circular buffer index (0..31)
  - name: ntiles
    type: uint32_t
    is_template: false
    description: Number of free tile slots to reserve
  hardware_effects:
  - Polls local L1 CB occupancy register until >= ntiles free space exists
  failure_mode: Calling on TRISC0 (UNPACK) or TRISC1 (MATH) is forbidden. Reserving more tiles than CB capacity deadlocks.
  description: Blocking call waiting for consumer to free space in back of circular buffer.
- name: cb_push_back
  signature: void cb_push_back(uint32_t cbid, uint32_t ntiles)
  header: tt_metal/hw/inc/api/compute/cb_api.h
  category: cb_lifecycle
  thread_affinity:
  - TRISC2_PACK
  - DM_BRISC
  - DM_NCRISC
  placement: after_pack_or_write
  allowed_in_loop: true
  state_machine:
    precondition_state: CB_SLOTS_RESERVED
    postcondition_state: ANY
    must_pair_with: cb_reserve_back
  parameters:
  - name: cbid
    type: uint32_t
    is_template: false
    description: Circular buffer index (0..31)
  - name: ntiles
    type: uint32_t
    is_template: false
    description: Number of tiles to commit to back
  hardware_effects:
  - Advances circular buffer write pointer in L1
  - Increments available tile counter for consumer
  failure_mode: Pushing without prior reserve or pushing before noc_async_read_barrier publishes corrupted unwritten memory.
  description: Commits newly written tiles into circular buffer back, making them visible to consumer.
- name: cb_pages_reservable_at_back
  signature: bool cb_pages_reservable_at_back(int32_t operand, int32_t num_pages)
  header: tt_metal/hw/inc/api/compute/cb_api.h
  category: cb_lifecycle
  thread_affinity:
  - TRISC2_PACK
  - DM_BRISC
  - DM_NCRISC
  placement: before_reserve
  allowed_in_loop: true
  state_machine:
    precondition_state: ANY
    postcondition_state: ANY
    must_pair_with: null
  parameters:
  - name: operand
    type: int32_t
    is_template: false
    description: Circular buffer index
  - name: num_pages
    type: int32_t
    is_template: false
    description: Number of pages to test
  hardware_effects:
  - Reads local L1 circular buffer free slot status non-blockingly
  failure_mode: None (non-blocking query).
  description: Non-blocking query checking whether num_pages can be reserved at the back of the CB without stalling.
- name: cb_pages_available_at_front
  signature: bool cb_pages_available_at_front(int32_t operand, int32_t num_pages)
  header: tt_metal/hw/inc/api/compute/cb_api.h
  category: cb_lifecycle
  thread_affinity:
  - TRISC0_UNPACK
  - DM_BRISC
  - DM_NCRISC
  placement: before_wait
  allowed_in_loop: true
  state_machine:
    precondition_state: ANY
    postcondition_state: ANY
    must_pair_with: null
  parameters:
  - name: operand
    type: int32_t
    is_template: false
    description: Circular buffer index
  - name: num_pages
    type: int32_t
    is_template: false
    description: Number of pages to test
  hardware_effects:
  - Reads local L1 circular buffer valid page occupancy non-blockingly
  failure_mode: None (non-blocking query).
  description: Non-blocking query checking whether num_pages are available at the front of the CB without stalling.
- name: noc_async_read
  signature: void noc_async_read(uint64_t src_noc_addr, uint32_t dest_local_l1_addr, uint32_t size_bytes)
  header: tt_metal/hw/inc/api/dataflow/dataflow_api.h
  category: dataflow_noc
  thread_affinity:
  - DM_BRISC
  - DM_NCRISC
  placement: between_reserve_and_push
  allowed_in_loop: true
  state_machine:
    precondition_state: CB_SLOTS_RESERVED
    postcondition_state: NOC_READ_IN_FLIGHT
    must_pair_with: noc_async_read_barrier
  parameters:
  - name: src_noc_addr
    type: uint64_t
    is_template: false
    description: Source NoC byte address
  - name: dest_local_l1_addr
    type: uint32_t
    is_template: false
    description: Destination local L1 byte address
  - name: size_bytes
    type: uint32_t
    is_template: false
    description: Transfer size in bytes
  hardware_effects:
  - Enqueues non-blocking DMA read command on NoC hardware engine
  - Increments outstanding NoC read transaction counter
  failure_mode: Missing subsequent barrier before cb_push_back causes consumer to read unwritten L1 buffer.
  description: Issues asynchronous NoC read transfer from remote core/DRAM into local L1 buffer.
- name: noc_async_read_barrier
  signature: void noc_async_read_barrier()
  header: tt_metal/hw/inc/api/dataflow/dataflow_api.h
  category: dataflow_noc
  thread_affinity:
  - DM_BRISC
  - DM_NCRISC
  placement: before_cb_push_back
  allowed_in_loop: true
  state_machine:
    precondition_state: NOC_READ_IN_FLIGHT
    postcondition_state: CANONICAL_IDLE
    must_pair_with: noc_async_read
  parameters: []
  hardware_effects:
  - Blocks RISC execution until outstanding NoC read transaction counter reaches zero
  failure_mode: Omitting barrier causes data race with compute consumer.
  description: Synchronizes and guarantees completion of all in-flight asynchronous NoC read requests.
- name: noc_async_write
  signature: void noc_async_write(uint32_t src_local_l1_addr, uint64_t dest_noc_addr, uint32_t size_bytes)
  header: tt_metal/hw/inc/api/dataflow/dataflow_api.h
  category: dataflow_noc
  thread_affinity:
  - DM_BRISC
  - DM_NCRISC
  placement: between_wait_and_pop
  allowed_in_loop: true
  state_machine:
    precondition_state: CB_TILES_AVAILABLE
    postcondition_state: NOC_WRITE_IN_FLIGHT
    must_pair_with: noc_async_write_barrier
  parameters:
  - name: src_local_l1_addr
    type: uint32_t
    is_template: false
    description: Source local L1 byte address
  - name: dest_noc_addr
    type: uint64_t
    is_template: false
    description: Destination NoC byte address
  - name: size_bytes
    type: uint32_t
    is_template: false
    description: Transfer size in bytes
  hardware_effects:
  - Enqueues non-blocking DMA write command on NoC hardware engine
  - Increments outstanding NoC write transaction counter
  failure_mode: Calling cb_pop_front before write barrier allows producer to overwrite source L1 data mid-transfer.
  description: Issues asynchronous NoC write transfer from local L1 buffer to remote core or DRAM.
- name: noc_async_write_barrier
  signature: void noc_async_write_barrier()
  header: tt_metal/hw/inc/api/dataflow/dataflow_api.h
  category: dataflow_noc
  thread_affinity:
  - DM_BRISC
  - DM_NCRISC
  placement: before_cb_pop_front
  allowed_in_loop: true
  state_machine:
    precondition_state: NOC_WRITE_IN_FLIGHT
    postcondition_state: CANONICAL_IDLE
    must_pair_with: noc_async_write
  parameters: []
  hardware_effects:
  - Blocks RISC execution until outstanding NoC write transaction counter reaches zero and writes commit
  failure_mode: Omitting barrier before pop creates Write-After-Read race condition in L1.
  description: Synchronizes and guarantees completion of all in-flight asynchronous NoC write requests.
- name: noc_semaphore_inc
  signature: void noc_semaphore_inc(uint64_t dest_noc_addr, uint32_t val)
  header: tt_metal/hw/inc/api/dataflow/dataflow_api.h
  category: dataflow_noc
  thread_affinity:
  - DM_BRISC
  - DM_NCRISC
  placement: anywhere
  allowed_in_loop: true
  state_machine:
    precondition_state: ANY
    postcondition_state: ANY
    must_pair_with: null
  parameters:
  - name: dest_noc_addr
    type: uint64_t
    is_template: false
    description: Destination NoC address of semaphore
  - name: val
    type: uint32_t
    is_template: false
    description: Increment value
  hardware_effects:
  - Performs atomic NoC 32-bit addition at destination semaphore address
  failure_mode: Incorrect remote address or missing write barrier beforehand sends stale signal.
  description: Atomically increments remote core NoC semaphore across the network-on-chip.
- name: noc_semaphore_wait
  signature: void noc_semaphore_wait(volatile uint32_t* sem_addr, uint32_t val)
  header: tt_metal/hw/inc/api/dataflow/dataflow_api.h
  category: dataflow_noc
  thread_affinity:
  - DM_BRISC
  - DM_NCRISC
  placement: before_critical_section
  allowed_in_loop: true
  state_machine:
    precondition_state: ANY
    postcondition_state: ANY
    must_pair_with: null
  parameters:
  - name: sem_addr
    type: volatile uint32_t*
    is_template: false
    description: Local L1 pointer to semaphore variable
  - name: val
    type: uint32_t
    is_template: false
    description: Expected semaphore threshold value
  hardware_effects:
  - Spins until memory contents at sem_addr are >= val
  failure_mode: If peer fails to increment semaphore or increments with wrong value, thread hangs indefinitely.
  description: Blocks execution until local semaphore value is greater than or equal to target value.
- name: noc_semaphore_set
  signature: void noc_semaphore_set(volatile uint32_t* sem_addr, uint32_t val)
  header: tt_metal/hw/inc/api/dataflow/dataflow_api.h
  category: dataflow_noc
  thread_affinity:
  - DM_BRISC
  - DM_NCRISC
  placement: anywhere
