    exu: {unpack: {require: mul_reuse_dest}, fpu: {require: mul_reuse_dest}}
    resources: {dst_math: {require: held}}
    args: {icb0: 0, idst: 2}
    targs: {reuse_dest: 0}
    header: api/compute/eltwise_binary.h

  # === FPU Broadcast Binary & Unary Broadcast (26) ===
  bcast_init:
    kind: init
    threads: [unpack, math]
    exu: {unpack: {require: clean, set: bcast_generic}, fpu: {require: clean, set: bcast_generic}}
    args: {icb0: 0, icb1: 1}
    targs: {bcast_op: 0, bcast_dim: 1}
    header: api/compute/bcast.h
  any_tiles_bcast:
    kind: op
    threads: [unpack, math]
    exu:
      unpack:
        require:
          - bcast_generic
          - add_bcast_rows
          - add_bcast_cols
          - add_bcast_scalar
          - sub_bcast_rows
          - sub_bcast_cols
          - sub_bcast_scalar
          - mul_bcast_rows
          - mul_bcast_cols
          - mul_bcast_scalar
      fpu:
        require:
          - bcast_generic
          - add_bcast_rows
          - add_bcast_cols
          - add_bcast_scalar
          - sub_bcast_rows
          - sub_bcast_cols
          - sub_bcast_scalar
          - mul_bcast_rows
          - mul_bcast_cols
          - mul_bcast_scalar
    resources: {dst_math: {require: held}}
    args: {icb0: 0, icb1: 1, idst: 4}
