- name: log_tile_init
  signature: void log_tile_init()
  header: tt_metal/hw/inc/api/compute/compute_kernel_api.h
  category: sfpu_stateful
  thread_affinity:
  - TRISC1_MATH
  placement: before_log_tile
  allowed_in_loop: true
  state_machine:
    precondition_state: MATH_DST_HELD
    postcondition_state: MATH_DST_HELD
    must_pair_with: null
  parameters: []
  hardware_effects:
  - Writes sfpi::vConstFloatPrgm0 = 0.69314718f (ln2)
  - Writes sfpi::vConstFloatPrgm1 = 0.10968964f
  - Writes sfpi::vConstFloatPrgm2 = -0.72910421f
  failure_mode: If another op clobbers vConstFloatPrgm0..2 and log_tile runs without re-init, mathematical corruption occurs.
  description: Programs SFPU programmable constant registers with ln(2) and polynomial coefficients for logarithm.
