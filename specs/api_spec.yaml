- name: custom_mm_block_init
  signature: template <PackCustomMmLayout layout = PackCustomMmLayout::Dense> void custom_mm_block_init(uint32_t in0_cb, uint32_t
    in1_cb, uint32_t out_cb, uint32_t ct_dim, uint32_t rt_dim, uint32_t kt_dim)
  header: tt_metal/hw/inc/api/compute/experimental/custom_mm.h
  category: custom_mm
  thread_affinity:
  - TRISC0_UNPACK
  - TRISC1_MATH
  - TRISC2_PACK
  placement: before_custom_mm_block
  allowed_in_loop: true
  state_machine:
    precondition_state: CANONICAL_IDLE
    postcondition_state: IN_CUSTOM_MM_DENSE_MODE
    must_pair_with: custom_mm_block_uninit
  parameters:
  - name: layout
    type: PackCustomMmLayout
    is_template: true
    description: 'Memory layout: Dense or Strided'
  - name: in0_cb
    type: uint32_t
    is_template: false
    description: Input activation CB
  - name: in1_cb
    type: uint32_t
    is_template: false
    description: Input weight CB
  - name: out_cb
    type: uint32_t
    is_template: false
    description: Output CB
  - name: ct_dim
    type: uint32_t
    is_template: false
    description: Column dimension
  - name: rt_dim
    type: uint32_t
    is_template: false
    description: Row dimension
  - name: kt_dim
    type: uint32_t
    is_template: false
    description: Reduction dimension
  hardware_effects:
  - 'PACK: programs customized non-canonical destination offset registers and packing strides for dense sub-blocks'
  failure_mode: Failing to call custom_mm_block_uninit leaves packer in dense layout mode, corrupting subsequent standard
    pack_tile calls.
  description: Initializes high-performance custom matmul with specialized non-canonical destination packing layouts.
- name: custom_mm_block_uninit
  signature: template <PackCustomMmLayout layout = PackCustomMmLayout::Dense> void custom_mm_block_uninit(uint32_t out_cb)
  header: tt_metal/hw/inc/api/compute/experimental/custom_mm.h
  category: custom_mm
  thread_affinity:
  - TRISC2_PACK
  placement: after_custom_mm_block
  allowed_in_loop: true
  state_machine:
    precondition_state: IN_CUSTOM_MM_DENSE_MODE
    postcondition_state: CANONICAL_IDLE
    must_pair_with: custom_mm_block_init
  parameters:
  - name: layout
    type: PackCustomMmLayout
    is_template: true
    description: Memory layout matching init
  - name: out_cb
    type: uint32_t
    is_template: false
    description: Output CB index
  hardware_effects:
  - 'PACK: _llk_pack_custom_mm_uninit_<layout>(pack_src_format[out_cb]) restores canonical destination offset registers'
  failure_mode: Missing uninit leaves packer reading non-canonical destination offsets, corrupting subsequent tile packing.
  description: Restores canonical packer destination offset registers after custom matmul block execution.
