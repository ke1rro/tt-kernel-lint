- name: matmul_tiles
  signature: void matmul_tiles(uint32_t in0_cb, uint32_t in1_cb, uint32_t in0_tile, uint32_t in1_tile, uint32_t idst)
  header: tt_metal/hw/inc/api/compute/matmul.h
  category: matmul
  thread_affinity:
  - TRISC0_UNPACK
  - TRISC1_MATH
  placement: between_acquire_commit
  allowed_in_loop: true
  state_machine:
    precondition_state: MATH_DST_HELD
    postcondition_state: MATH_DST_HELD
    must_pair_with: null
  parameters:
  - name: in0_cb
    type: uint32_t
    is_template: false
    description: Input CB 0 index
  - name: in1_cb
    type: uint32_t
    is_template: false
    description: Input CB 1 index
  - name: in0_tile
    type: uint32_t
    is_template: false
    description: Tile index in input CB 0
  - name: in1_tile
    type: uint32_t
    is_template: false
    description: Tile index in input CB 1
  - name: idst
    type: uint32_t
    is_template: false
    description: Destination register slot index
  hardware_effects:
  - 'UNPACK: reads in0_tile into SrcB and in1_tile into SrcA'
  - 'MATH: executes FPU matrix multiply-accumulate into DST[idst]'
  failure_mode: idst exceeding DST capacity overwrites opposite ping-pong half, corrupting packer output.
  description: Multiplies tile A by tile B and accumulates product into DST register slot idst.
