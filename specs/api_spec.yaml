# Tenstorrent Kernel API Static-Analysis Specification (Explicit EXU State Machine)
# Ground-truth verified directly against tt-metal/tt_metal/hw/inc/ headers.
#
# State model tracked by the analyzer at every CFG point:
#   EXUs:      compute: unpack, fpu, sfpu, pack, sfpu_pack | dm: noc_rd_state, noc_wr_state, noc_inline_state
#              Each EXU holds {mode, dirty, bound_args}. Initial: uninit (compute) / idle (dm).
#              Meta-requirements in `require`:
#                uninit  -> mode == uninit (before hw startup)
#                started -> mode != uninit (any active mode, clean or dirty)
#                clean   -> mode != uninit && !dirty (safe to seat a new init)
#                <mode>  -> mode == <mode> (or in list of allowed modes)
#              Transitions: `set` writes new mode (resets dirty=false unless `dirty: true`).
#              Any EXU with dirty=true must be reset to `idle` via `uninit` before switching or exit.
#   Resources: dst_math, dst_pack (free|held) | dest_acc (default|overridden)
#              cb_in (idle|ready, per CB) | cb_out (idle|reserved, per CB)
#              noc_rd, noc_wr, noc_atomic (idle|in_flight, per noc/trid)
#
# Entry fields (optional fields omitted when default/empty):
#   kind:         startup | cleanup | reconfig | init | op | uninit | acquire | release
#   threads:      [unpack | math | pack | dm]
#   exu:          {unit: {require, set, dirty}}
#   resources:    {resource: {require, set}}
#   uninit:       uninit command(s) required when any EXU is marked dirty: true
#   pair:         partner acquire/release command(s) for lifecycle diagnostics
#   args / targs: {semantic_role: arg_index} for argument consistency across init/op/uninit
#   stateful:     true for SFPU inits writing persistent LREG/replay state
#   in_loop:      false if unsafe inside loops
#   arch:         subset of [wh, bh, quasar] when not available on all 3
#   deprecated:   true if [[deprecated]] in tt-metal
#   experimental: true if defined under api/compute/experimental/
#   header:       defining header relative to tt-metal/tt_metal/hw/inc/

version: '2.1'
tt_metal_commit: '07fac6de536'

instructions:
  # === Startup, Cleanup & Dest Accumulation (8) ===
  compute_kernel_hw_startup:
    kind: startup
    threads: [unpack, math, pack]
    exu:
      unpack: {require: uninit, set: idle}
      fpu: {require: uninit, set: idle}
      sfpu: {require: uninit, set: idle}
      pack: {require: uninit, set: idle}
      sfpu_pack: {require: uninit, set: idle}
    resources: {dst_math: {require: free}, dst_pack: {require: free}}
    args: {icb0: 0, icb1: 1, ocb: 2}
    targs: {src_order: 0}
    in_loop: false
    header: api/compute/compute_kernel_hw_startup.h
  unary_op_init_common:
    kind: startup
    threads: [unpack, math, pack]
    exu:
      unpack: {require: uninit, set: copy}
      fpu: {require: uninit, set: copy}
      sfpu: {require: uninit, set: idle}
      pack: {require: uninit, set: idle}
      sfpu_pack: {require: uninit, set: idle}
    resources: {dst_math: {require: free}, dst_pack: {require: free}}
    args: {icb0: 0, ocb: 1}
    in_loop: false
    deprecated: true
    header: api/compute/eltwise_unary/eltwise_unary.h
  init_sfpu:
    kind: startup
    threads: [unpack, math, pack]
    exu:
      unpack: {require: uninit, set: copy}
      fpu: {require: uninit, set: copy}
      sfpu: {require: uninit, set: idle}
      pack: {require: uninit, set: idle}
      sfpu_pack: {require: uninit, set: idle}
    resources: {dst_math: {require: free}, dst_pack: {require: free}}
    args: {icb0: 0, ocb: 1}
    in_loop: false
    deprecated: true
    header: api/compute/eltwise_unary/eltwise_unary.h
  compute_kernel_hw_cleanup:
    kind: cleanup
    threads: [unpack, math, pack]
    exu:
      unpack: {require: started, set: idle}
      fpu: {require: started, set: idle}
      sfpu: {require: started, set: idle}
      pack: {require: started, set: uninit}
      sfpu_pack: {require: started, set: idle}
    resources: {dst_math: {require: free}, dst_pack: {require: free}}
    in_loop: false
    arch: [bh]
    experimental: true
    header: api/compute/experimental/compute_kernel_hw_cleanup.h
  enable_fp32_dest_acc:
    kind: acquire
    threads: [unpack, math, pack]
    exu: {unpack: {require: started}, fpu: {require: started}, pack: {require: started}}
    resources:
      dst_math: {require: free}
      dst_pack: {require: free}
      dest_acc: {require: default, set: overridden}
    pair: disable_fp32_dest_acc
    arch: [wh, bh]
    header: api/compute/compute_kernel_hw_startup.h
  disable_fp32_dest_acc:
    kind: release
    threads: [unpack, math, pack]
    exu: {unpack: {require: started}, fpu: {require: started}, pack: {require: started}}
    resources:
      dst_math: {require: free}
      dst_pack: {require: free}
      dest_acc: {require: overridden, set: default}
    pair: enable_fp32_dest_acc
    arch: [wh, bh]
    header: api/compute/compute_kernel_hw_startup.h
  set_fp32_dest_acc:
    kind: acquire
    threads: [unpack, math, pack]
    exu: {unpack: {require: started}, fpu: {require: started}, pack: {require: started}}
    resources:
      dst_math: {require: free}
      dst_pack: {require: free}
      dest_acc: {require: default, set: overridden}
    pair: restore_fp32_dest_acc
    targs: {enable: 0}
    arch: [wh, bh]
    header: api/compute/compute_kernel_hw_startup.h
  restore_fp32_dest_acc:
    kind: release
    threads: [unpack, math, pack]
    exu: {unpack: {require: started}, fpu: {require: started}, pack: {require: started}}
    resources:
      dst_math: {require: free}
      dst_pack: {require: free}
      dest_acc: {require: overridden, set: default}
    pair: set_fp32_dest_acc
    targs: {enable: 0}
    arch: [wh, bh]
    header: api/compute/compute_kernel_hw_startup.h

  # === DST Register Synchronization (8) ===
  tile_regs_acquire:
    kind: acquire
    threads: [unpack, math]
    resources: {dst_math: {require: free, set: held}}
    pair: tile_regs_commit
    header: api/compute/reg_api.h
  tile_regs_commit:
    kind: release
    threads: [unpack, math]
    resources: {dst_math: {require: held, set: free}}
    pair: [tile_regs_acquire, tile_regs_acquire_math_clear]
    header: api/compute/reg_api.h
  tile_regs_wait:
    kind: acquire
    threads: [pack]
    resources: {dst_pack: {require: free, set: held}}
    pair: [tile_regs_release, tile_regs_release_math_clear]
    header: api/compute/reg_api.h
  tile_regs_release:
    kind: release
    threads: [pack]
    resources: {dst_pack: {require: held, set: free}}
    pair: tile_regs_wait
    header: api/compute/reg_api.h
  acquire_dst:
    kind: acquire
    threads: [unpack, math, pack]
    resources: {dst_math: {require: free, set: held}, dst_pack: {require: free, set: held}}
    pair: release_dst
    deprecated: true
    header: api/compute/reg_api.h
  release_dst:
    kind: release
    threads: [unpack, math, pack]
    resources: {dst_math: {require: held, set: free}, dst_pack: {require: held, set: free}}
    pair: acquire_dst
    deprecated: true
    header: api/compute/reg_api.h
  tile_regs_acquire_math_clear:
    kind: acquire
    threads: [math]
    resources: {dst_math: {require: free, set: held}}
    pair: tile_regs_commit
    arch: [bh]
    experimental: true
    header: api/compute/experimental/reg_api.h
  tile_regs_release_math_clear:
    kind: release
    threads: [pack]
    resources: {dst_pack: {require: held, set: free}}
    pair: tile_regs_wait
    arch: [bh]
    experimental: true
    header: api/compute/experimental/reg_api.h

  # === Circular Buffer Synchronization (8) ===
  cb_wait_front:
    kind: acquire
    threads: [unpack, dm]
    resources: {cb_in: {set: ready}}
    pair: cb_pop_front
    args: {cb: 0, ntiles: 1}
    header: api/compute/cb_api.h
  cb_pop_front:
    kind: release
    threads: [unpack, dm]
    resources: {cb_in: {require: ready, set: idle}}
    pair: cb_wait_front
    args: {cb: 0, ntiles: 1}
    header: api/compute/cb_api.h
  cb_reserve_back:
    kind: acquire
    threads: [pack, dm]
    resources: {cb_out: {set: reserved}}
    pair: cb_push_back
    args: {cb: 0, ntiles: 1}
    header: api/compute/cb_api.h
  cb_push_back:
    kind: release
    threads: [pack, dm]
    resources: {cb_out: {require: reserved, set: idle}}
    pair: cb_reserve_back
    args: {cb: 0, ntiles: 1}
    header: api/compute/cb_api.h
  cb_pages_available_at_front:
    kind: op
    threads: [dm]
    args: {cb: 0, ntiles: 1}
    header: api/dataflow/dataflow_api.h
  cb_pages_reservable_at_back:
    kind: op
    threads: [dm]
    args: {cb: 0, ntiles: 1}
    header: api/dataflow/dataflow_api.h
  get_tile_address:
    kind: op
    threads: [unpack, math, pack]
    resources: {cb_in: {require: ready}}
    args: {cb: 0}
    header: api/compute/cb_api.h
  read_tile_value:
    kind: op
    threads: [unpack, math, pack]
    resources: {cb_in: {require: ready}}
    args: {cb: 0}
    header: api/compute/cb_api.h

  # === Data Format & Geometry Reconfiguration (15) ===
  reconfig_data_format:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    targs: {src_order: 0}
    header: api/compute/reconfig_data_format.h
  reconfig_data_format_srca:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    header: api/compute/reconfig_data_format.h
  reconfig_data_format_srcb:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    header: api/compute/reconfig_data_format.h
  reconfig_data_format_skip_int8:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    targs: {src_order: 0}
    header: api/compute/reconfig_data_format.h
  reconfig_data_format_srca_skip_int8:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    header: api/compute/reconfig_data_format.h
  reconfig_data_format_srcb_skip_int8:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    header: api/compute/reconfig_data_format.h
  reconfig_full_operand:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    targs: {src_order: 0}
    arch: [wh, bh]
    header: api/compute/reconfig_data_format.h
  reconfig_full_operand_srca:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    arch: [wh, bh]
    header: api/compute/reconfig_data_format.h
  reconfig_full_operand_srcb:
    kind: reconfig
    threads: [unpack, math]
    exu: {unpack: {require: started}, fpu: {require: started}}
    arch: [wh, bh]
    header: api/compute/reconfig_data_format.h
  reconfig_tile_shape:
    kind: reconfig
    threads: [unpack]
    exu: {unpack: {require: started}}
    targs: {src_order: 0}
    arch: [wh, bh]
    header: api/compute/reconfig_data_format.h
  reconfig_tile_shape_srca:
    kind: reconfig
    threads: [unpack]
    exu: {unpack: {require: started}}
    arch: [wh, bh]
    header: api/compute/reconfig_data_format.h
  reconfig_tile_shape_srcb:
    kind: reconfig
    threads: [unpack]
    exu: {unpack: {require: started}}
    arch: [wh, bh]
    header: api/compute/reconfig_data_format.h
  pack_reconfig_data_format:
    kind: reconfig
    threads: [pack]
    exu: {pack: {require: [uninit, started]}}
    targs: {tile_dim_reconfig: 0}
    header: api/compute/reconfig_data_format.h
  pack_reconfig_l1_acc:
    kind: reconfig
    threads: [pack]
    exu: {pack: {require: started}}
    header: api/compute/pack.h
  pack_relu_config:
    kind: reconfig
    threads: [pack]
    exu: {pack: {require: started}}
    header: api/compute/pack.h

  # === FPU Eltwise Binary (16) ===
  binary_tiles_init:
    kind: init
    threads: [unpack, math]
    exu: {unpack: {require: clean, set: binary_generic}, fpu: {require: clean, set: binary_generic}}
    args: {icb0: 0, icb1: 1}
    targs: {eltwise_binary_type: 1}
    header: api/compute/eltwise_binary.h
  add_init:
    kind: init
    threads: [unpack, math]
    exu: {unpack: {require: clean, set: add}, fpu: {require: clean, set: add}}
    args: {icb0: 0, icb1: 1}
    header: api/compute/eltwise_binary.h
  add_tiles:
    kind: op
    threads: [unpack, math]
    exu: {unpack: {require: [add, binary_generic]}, fpu: {require: [add, binary_generic]}}
    resources: {dst_math: {require: held}}
    args: {icb0: 0, icb1: 1, idst: 4}
    header: api/compute/eltwise_binary.h
  add_block:
    kind: op
    threads: [unpack, math]
    exu: {unpack: {require: [add, binary_generic]}, fpu: {require: [add, binary_generic]}}
    resources: {dst_math: {require: held}}
    args: {icb0: 0, icb1: 1, idst: 4, ntiles: 5}
    header: api/compute/eltwise_binary.h
  add_reuse_dest_init:
    kind: init
    threads: [unpack, math]
    exu: {unpack: {require: clean, set: add_reuse_dest}, fpu: {require: clean, set: add_reuse_dest}}
    args: {icb0: 0}
    targs: {reuse_dest: 0}
    header: api/compute/eltwise_binary.h
  add_reuse_dest_tiles:
    kind: op
    threads: [unpack, math]
    exu: {unpack: {require: add_reuse_dest}, fpu: {require: add_reuse_dest}}
    resources: {dst_math: {require: held}}
    args: {icb0: 0, idst: 2}
    targs: {reuse_dest: 0}
    header: api/compute/eltwise_binary.h
  sub_init:
    kind: init
    threads: [unpack, math]
    exu: {unpack: {require: clean, set: sub}, fpu: {require: clean, set: sub}}
    args: {icb0: 0, icb1: 1}
    header: api/compute/eltwise_binary.h
  sub_tiles:
    kind: op
    threads: [unpack, math]
    exu: {unpack: {require: [sub, binary_generic]}, fpu: {require: [sub, binary_generic]}}
    resources: {dst_math: {require: held}}
    args: {icb0: 0, icb1: 1, idst: 4}
    header: api/compute/eltwise_binary.h
  sub_block:
    kind: op
    threads: [unpack, math]
    exu: {unpack: {require: [sub, binary_generic]}, fpu: {require: [sub, binary_generic]}}
    resources: {dst_math: {require: held}}
    args: {icb0: 0, icb1: 1, idst: 4, ntiles: 5}
    header: api/compute/eltwise_binary.h
  sub_reuse_dest_init:
    kind: init
    threads: [unpack, math]
    exu: {unpack: {require: clean, set: sub_reuse_dest}, fpu: {require: clean, set: sub_reuse_dest}}
    args: {icb0: 0}
    targs: {reuse_dest: 0}
    header: api/compute/eltwise_binary.h
  sub_reuse_dest_tiles:
    kind: op
    threads: [unpack, math]
    exu: {unpack: {require: sub_reuse_dest}, fpu: {require: sub_reuse_dest}}
    resources: {dst_math: {require: held}}
    args: {icb0: 0, idst: 2}
    targs: {reuse_dest: 0}
    header: api/compute/eltwise_binary.h
  mul_init:
    kind: init
    threads: [unpack, math]
    exu: {unpack: {require: clean, set: mul}, fpu: {require: clean, set: mul}}
    args: {icb0: 0, icb1: 1}
    header: api/compute/eltwise_binary.h
  mul_tiles:
    kind: op
    threads: [unpack, math]
    exu: {unpack: {require: [mul, binary_generic]}, fpu: {require: [mul, binary_generic]}}
    resources: {dst_math: {require: held}}
    args: {icb0: 0, icb1: 1, idst: 4}
    header: api/compute/eltwise_binary.h
  mul_block:
    kind: op
    threads: [unpack, math]
    exu: {unpack: {require: [mul, binary_generic]}, fpu: {require: [mul, binary_generic]}}
    resources: {dst_math: {require: held}}
