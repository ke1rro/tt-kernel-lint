  add_tiles_bcast:
    kind: op
    threads: [unpack, math]
    exu:
      unpack: {require: [add_bcast_rows, add_bcast_cols, add_bcast_scalar, bcast_generic]}
      fpu: {require: [add_bcast_rows, add_bcast_cols, add_bcast_scalar, bcast_generic]}
