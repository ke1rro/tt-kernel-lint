minimum_pre_commit_version: "4.7.0"

exclude: ^(tt-metal|ttsim|tt-isa-documentation|\.venv|build|build_[^/]+)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: .venv/bin/python -m isort
        language: system
        types: [python]
      - id: black
        name: black
        entry: .venv/bin/python -m black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: .venv/bin/python -m flake8
        language: system
        types: [python]
      - id: clang-format
        name: clang-format
        entry: .venv/bin/clang-format
        language: system
        files: ^tt-lint/(include|src)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp|tpp)$
        args: ["--style=file", "--dry-run", "--Werror"]
      - id: clang-tidy
        name: clang-tidy
        entry: >-
          sh -c 'if [ ! -f build/compile_commands.json ]; then
          echo "Missing build/compile_commands.json; configure CMake with -DCMAKE_EXPORT_COMPILE_COMMANDS=ON." >&2;
          exit 1; fi;
          exec .venv/bin/clang-tidy -p build "$@"' --
        language: system
        files: ^tt-lint/(include|src)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp|tpp)$
        args:
          - --config-file=.clang-tidy
          - --header-filter=(^|/)tt-lint/(include|src)/
          - --warnings-as-errors=*
